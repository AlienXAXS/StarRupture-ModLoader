name: SR layout drift

# Fails when a layout table in core/ is out of date. The layout table
# (core/layout_table_<CL>.generated.h) is the list of Game-SDK classes the
# loader's sources name, with each class's size and member offsets. It is made
# by tools/Update-LayoutTable.ps1 from the loader's sources and one Game-SDK
# commit, so it goes stale when a source starts naming another SDK type, when
# the Game-SDK submodule moves, or when the table is edited by hand.
#
# This job makes every table again from the same inputs and diffs it with the
# committed file. The newest table uses the Game-SDK submodule; an older table
# uses the Game-SDK commit in tools/layout-table-pins.json. The generator and
# the Plugin SDK's rule-3 list are pinned below, so the result depends only on
# the checkout, never on what those repos did since. No build, no secrets, no
# artifacts; every repo is checked out read-only.
#
# The dedicated server has its own table (core/layout_table_server_<CL>
# .generated.h, from the Server folder of the Game-SDK submodule). It is made
# from only the files the Server configurations compile, and the Core project
# file says which those are; tools/Update-LayoutTable.ps1 -Server reads that
# list. A second job (layout-drift-server) runs that script on Windows instead
# of repeating the project-file reading here, so CI and the script cannot
# disagree about which files the server reads.
#
# Fix a red run: tools/Update-LayoutTable.ps1 (the failure text says how) and
# commit the result with the change.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'StarRupture-ModLoader-Core/**'
      - 'Tests/LayoutCheckTests/**'
      - 'StarRupture SDK'
      - 'tools/Update-LayoutTable.ps1'
      - 'tools/layout-table-pins.json'
      - '.github/workflows/sr-layout-drift.yml'
  push:
    branches: [main]
    paths:
      - 'StarRupture-ModLoader-Core/**'
      - 'Tests/LayoutCheckTests/**'
      - 'StarRupture SDK'
      - 'tools/Update-LayoutTable.ps1'
      - 'tools/layout-table-pins.json'
      - '.github/workflows/sr-layout-drift.yml'

permissions: {}

env:
  # Repos come from the owner running this workflow; a repo variable
  # SR_OWNER overrides that when the mods live under a different account.
  OWNER: ${{ vars.SR_OWNER || github.repository_owner }}
  # The generator's repo (the default feed_repo of vmap-publish.yml).
  CI_REPO: msantoro12/starrupture-ci
  # Pinned on purpose: a bump is a reviewed change. The generator's output has
  # no timestamps or paths, so a bump that changes it shows up as drift in
  # the same change.
  # starrupture-ci: ci/layout-table.mjs with --consumer and --plugin-sdk.
  CI_SHA: ddbfa6f8b86ad299b511b3d48867a3c9941953f6
  # StarRupture-Plugin-SDK: tools/rule3-allow.json (read for enginePackages).
  PLUGIN_SDK_SHA: 75ac2f51f129573989e7e7fbe38e0aa0e8259f54

jobs:
  layout-drift:
    name: layout-drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The loader sits in its own folder: the generator reads every source
      # file under the folder it is given, so the other checkouts must not be
      # in it.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          path: loader
          # The Game SDK is the loader's own git submodule, so the newest table
          # is checked against the commit this change pins.
          submodules: true
          persist-credentials: false

      - name: Checkout the generator
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ env.CI_SHA }}
          path: ci
          sparse-checkout: ci
          persist-credentials: false

      - name: Checkout Plugin SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OWNER }}/StarRupture-Plugin-SDK
          ref: ${{ env.PLUGIN_SDK_SHA }}
          path: plugin-sdk
          sparse-checkout: tools/rule3-allow.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Check the tables and their pins agree
        working-directory: loader
        run: |
          # Every table is checked, so a table nobody pinned, a pin with no
          # table, or a table for another build than the loader's fails here
          # with its own message instead of a confusing diff further down.
          C=StarRupture-ModLoader-Core
          SDK='StarRupture SDK/Client'
          echo "generator: $CI_REPO at $CI_SHA"
          echo "Plugin SDK: $OWNER/StarRupture-Plugin-SDK at $PLUGIN_SDK_SHA"
          fail=0
          built="$(sed -nE 's/.*kBuiltCL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$C/hooks/game/version_map.generated.h" | head -n1)"
          if [ -z "$built" ]; then
            echo "::error::Could not read kBuiltCL from $C/hooks/game/version_map.generated.h"
            exit 1
          fi
          # The server's table (layout_table_server_<CL>) is checked by the
          # layout-drift-server job.
          tables="$(ls "$C"/core/layout_table_[0-9]*.generated.h | sed -E 's/.*layout_table_([0-9]+)\.generated\.h$/\1/' | sort -n || true)"
          newest="$(printf '%s\n' "$tables" | tail -n1)"
          if [ "$newest" != "$built" ]; then
            echo "::error::version_map.generated.h says CL $built but the newest layout table is for CL $newest"
            fail=1
          fi
          sdkcl="$(tr -d '[:space:]' 2>/dev/null < "$SDK/build_cl.txt" || true)"
          if [ "$sdkcl" != "$built" ]; then
            echo "::error::version_map.generated.h says CL $built but the Game-SDK submodule's build_cl.txt says '$sdkcl'"
            fail=1
          fi
          pinned="$(jq -r 'keys[]' tools/layout-table-pins.json | sort -n)"
          older="$(printf '%s\n' "$tables" | grep -vx "$newest" || true)"
          for cl in $(comm -23 <(printf '%s\n' "$older" | sort) <(printf '%s\n' "$pinned" | sort)); do
            echo "::error::core/layout_table_$cl.generated.h has no Game-SDK commit in tools/layout-table-pins.json"
            fail=1
          done
          for cl in $(comm -13 <(printf '%s\n' "$older" | sort) <(printf '%s\n' "$pinned" | sort)); do
            echo "::error::tools/layout-table-pins.json pins CL $cl, which is not an older table in core/"
            fail=1
          done
          for cl in $(jq -r 'to_entries[] | select(.value | test("^[0-9a-f]{40}$") | not) | .key' tools/layout-table-pins.json); do
            echo "::error::the pin for CL $cl in tools/layout-table-pins.json is not a full 40-character commit sha"
            fail=1
          done
          echo "tables: $(echo $tables); newest $newest (kBuiltCL $built); pinned: $(echo $pinned)"
          exit $fail

      - name: Make every table again and diff it with the committed one
        id: regen
        working-directory: loader
        run: |
          # The same command as tools/Update-LayoutTable.ps1, with the same
          # flags. Paths are absolute, as the script passes them.
          ROOT="$PWD"
          GEN="$GITHUB_WORKSPACE/ci/ci/layout-table.mjs"
          C="$ROOT/StarRupture-ModLoader-Core"
          out="$RUNNER_TEMP/regen"
          mkdir -p "$out"
          : > "$RUNNER_TEMP/stale"

          regen() { # <CL> <Game-SDK Client folder>
            node "$GEN" gen "$2/Assertions.inl" --cl "$1" \
              --src "$ROOT" --sdk "$2/SDK" --granularity 1 \
              --out "$out/layout_table_$1.generated.h" --namespace "SrLayoutTable_$1" \
              --consumer "core=$C" \
              --consumer "ui-menus=$C/hooks/game/game_menu/menu_layer.cpp" \
              --consumer "keys=$C/hooks/game/version_map.generated.h" \
              --consumer "keys=$C/hooks/game/version_map.server.h" \
              --consumer "keys=$C/hooks/game/scan_patterns.h" \
              --plugin-sdk "$GITHUB_WORKSPACE/plugin-sdk/tools/rule3-allow.json" > /dev/null
          }

          check() { # <CL>
            # Committed files have CRLF when checked out on Windows; the
            # regenerated file never does, so compare without it.
            committed="$C/core/layout_table_$1.generated.h"
            if diff -u --strip-trailing-cr --label "committed core/layout_table_$1.generated.h" --label "made again now" \
                "$committed" "$out/layout_table_$1.generated.h" > "$out/diff_$1.txt"; then
              echo "CL $1: core/layout_table_$1.generated.h is fresh"
            else
              echo "::error::CL $1: core/layout_table_$1.generated.h is out of date"
              echo "$1" >> "$RUNNER_TEMP/stale"
              echo "First 200 lines of the difference (- committed, + made again now):"
              head -n 200 "$out/diff_$1.txt"
              echo "What the committed table gets wrong, as the table compare reports it:"
              node "$GEN" compare "$committed" "$out/layout_table_$1.generated.h" || true
            fi
          }

          newest="$(sed -nE 's/.*kBuiltCL[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$C/hooks/game/version_map.generated.h" | head -n1)"
          echo "::group::CL $newest from the Game-SDK submodule"
          regen "$newest" "$ROOT/StarRupture SDK/Client"
          check "$newest"
          echo "::endgroup::"

          # An older build: the Game-SDK commit its table was made from.
          for cl in $(jq -r 'keys[]' tools/layout-table-pins.json | sort -n); do
            sha="$(jq -r --arg cl "$cl" '.[$cl]' tools/layout-table-pins.json)"
            echo "::group::CL $cl from Game-SDK commit $sha"
            sdk="$RUNNER_TEMP/game-sdk-$cl"
            git init -q "$sdk"
            git -C "$sdk" remote add origin "https://github.com/$OWNER/StarRupture-Game-SDK.git"
            git -C "$sdk" sparse-checkout set --no-cone Client/Assertions.inl Client/SDK Client/build_cl.txt
            if ! git -C "$sdk" fetch -q --depth 1 --filter=blob:none origin "$sha"; then
              echo "::error::pinned Game-SDK sha $sha for CL $cl not found in $OWNER/StarRupture-Game-SDK; fix tools/layout-table-pins.json"
              exit 1
            fi
            git -C "$sdk" checkout -q --detach FETCH_HEAD
            if [ -f "$sdk/Client/build_cl.txt" ] && [ "$(tr -d '[:space:]' < "$sdk/Client/build_cl.txt")" != "$cl" ]; then
              echo "::error::the Game-SDK commit pinned for CL $cl says CL $(cat "$sdk/Client/build_cl.txt") in build_cl.txt"
              exit 1
            fi
            regen "$cl" "$sdk/Client"
            check "$cl"
            echo "::endgroup::"
          done

          [ ! -s "$RUNNER_TEMP/stale" ]

      - name: What to do
        if: failure() && steps.regen.outcome == 'failure'
        run: |
          stale="$(tr '\n' ' ' < "$RUNNER_TEMP/stale" | sed 's/ $//')"
          if [ -z "$stale" ]; then
            echo "The generator did not finish; the error is in the step above."
            exit 0
          fi
          echo "::error::The layout table is out of date for CL $stale"
          for cl in $stale; do
            echo "The layout table core\\layout_table_$cl.generated.h is out of date. It is built from the loader's sources and the Game-SDK, and something it is built from changed."
          done
          echo
          echo "Fix: run .\\tools\\Update-LayoutTable.ps1 -Generator <path to starrupture-ci>\\ci\\layout-table.mjs -PluginSdk <path to Plugin SDK>\\tools\\rule3-allow.json"
          echo "and commit the result with your change. For an older build also pass -SdkClient <Game-SDK Client folder at the pinned commit> -Cl <CL>"
          echo "(the commit is in tools\\layout-table-pins.json). Use the same two repos this job did: starrupture-ci at $CI_SHA and the Plugin SDK at $PLUGIN_SDK_SHA."
          echo "The classes that changed are listed above."

  # The server's table. The server build compiles fewer files than the client
  # build, and which ones the Core project file says, so this job runs
  # tools/Update-LayoutTable.ps1 -Server itself on the one OS the script is
  # written for, instead of repeating its reading of the project file in bash.
  layout-drift-server:
    name: layout-drift-server
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          path: loader
          # The server table is made from the Server folder of the loader's
          # Game-SDK submodule.
          submodules: true
          persist-credentials: false

      - name: Checkout the generator
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.CI_REPO }}
          ref: ${{ env.CI_SHA }}
          path: ci
          sparse-checkout: ci
          persist-credentials: false

      - name: Checkout Plugin SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OWNER }}/StarRupture-Plugin-SDK
          ref: ${{ env.PLUGIN_SDK_SHA }}
          path: plugin-sdk
          sparse-checkout: tools/rule3-allow.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      - name: Check the server table and the server's build agree
        working-directory: loader
        shell: bash
        run: |
          # The CL of the server table, of the Server folder's build_cl.txt (which
          # sets the server build's kBuiltCL in Shared.props) and of the assert in
          # version_map.server.h must be one number.
          C=StarRupture-ModLoader-Core
          echo "generator: $CI_REPO at $CI_SHA"
          echo "Plugin SDK: $OWNER/StarRupture-Plugin-SDK at $PLUGIN_SDK_SHA"
          fail=0
          tables="$(ls "$C"/core/layout_table_server_[0-9]*.generated.h | sed -E 's/.*layout_table_server_([0-9]+)\.generated\.h$/\1/' | sort -n || true)"
          count="$(printf '%s\n' "$tables" | grep -c . || true)"
          newest="$(printf '%s\n' "$tables" | tail -n1)"
          if [ "$count" -ne 1 ]; then
            echo "::error::found $count server layout tables ($(echo $tables)); this job checks one, the newest. Check an older one the way the client job does (a pin in tools/layout-table-pins.json) before adding another."
            fail=1
          fi
          sdkcl="$(tr -d '[:space:]' 2>/dev/null < 'StarRupture SDK/Server/build_cl.txt' || true)"
          if [ "$sdkcl" != "$newest" ]; then
            echo "::error::the newest server layout table is for CL $newest but the Game-SDK submodule's Server/build_cl.txt says '$sdkcl'"
            fail=1
          fi
          built="$(sed -nE 's/.*static_assert\([[:space:]]*kBuiltCL[[:space:]]*==[[:space:]]*([0-9]+).*/\1/p' "$C/hooks/game/version_map.server.h" | head -n1)"
          if [ "$built" != "$newest" ]; then
            echo "::error::the newest server layout table is for CL $newest but version_map.server.h asserts the server's kBuiltCL is '$built'"
            fail=1
          fi
          echo "server tables: $(echo $tables); Server/build_cl.txt $sdkcl; version_map.server.h kBuiltCL $built"
          exit $fail

      - name: Make the server table again and diff it with the committed one
        id: regen
        working-directory: loader
        shell: pwsh
        run: |
          # The same command as tools/Update-LayoutTable.ps1 -Server: the
          # script itself, so the files it reads come from the project file in
          # one place. It writes the table in place, so keep the committed one.
          $gen = Join-Path $env:GITHUB_WORKSPACE 'ci\ci\layout-table.mjs'
          $plugin = Join-Path $env:GITHUB_WORKSPACE 'plugin-sdk\tools\rule3-allow.json'
          $core = Join-Path $PWD 'StarRupture-ModLoader-Core\core'
          $committed = Get-ChildItem $core -Filter 'layout_table_server_*.generated.h' | Select-Object -First 1
          $kept = Join-Path $env:RUNNER_TEMP 'committed-server-table.h'
          Copy-Item -LiteralPath $committed.FullName -Destination $kept

          # The script's own messages only: the generator also prints the table.
          & .\tools\Update-LayoutTable.ps1 -Server -Generator $gen -PluginSdk $plugin |
              Where-Object { $_ -match '^(Server sources|layout-table:|Wrote )' }

          # The committed file has CRLF when checked out on Windows; the
          # generator never writes it, so compare without it.
          $made = Join-Path $core $committed.Name
          $a = (Get-Content -Raw -LiteralPath $kept) -replace "`r`n", "`n"
          $b = if (Test-Path -LiteralPath $made) { (Get-Content -Raw -LiteralPath $made) -replace "`r`n", "`n" } else { $null }
          if ($a -ceq $b) {
              Write-Host "core/$($committed.Name) is fresh"
              exit 0
          }
          Write-Host "::error::core/$($committed.Name) is out of date"
          Write-Host 'First 200 lines of the difference (- committed, + made again now):'
          $keptLf = Join-Path $env:RUNNER_TEMP 'kept-server-table.h'
          $madeLf = Join-Path $env:RUNNER_TEMP 'made-server-table.h'
          [IO.File]::WriteAllText($keptLf, $a)
          [IO.File]::WriteAllText($madeLf, $b)
          git diff --no-index --no-color $keptLf $madeLf | Select-Object -First 200
          Write-Host 'What the committed table gets wrong, as the table compare reports it:'
          node $gen compare $keptLf $madeLf
          exit 1

      - name: What to do
        if: failure() && steps.regen.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The server layout table is out of date"
          echo "The server layout table core\\layout_table_server_<CL>.generated.h is out of date. It is built from the loader's sources that the Server configurations compile and the Game-SDK's Server folder, and something it is built from changed."
          echo
          echo "Fix: run .\\tools\\Update-LayoutTable.ps1 -Server -Generator <path to starrupture-ci>\\ci\\layout-table.mjs -PluginSdk <path to Plugin SDK>\\tools\\rule3-allow.json"
          echo "and commit the result with your change. Use the same two repos this job did: starrupture-ci at $CI_SHA and the Plugin SDK at $PLUGIN_SDK_SHA."
          echo "The classes that changed are listed above."
