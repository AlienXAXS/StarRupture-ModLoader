name: Build Plugins

# Triggers the release workflow on each plugin repo.
# Called by release.yml (auto_build_plugins), or dispatched manually to rebuild
# some or all plugins without cutting a modloader release.

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: 'Plugins to rebuild — "all", or comma-separated names (e.g. Codex,WAILA)'
        type: string
        default: 'all'
  workflow_call:
    inputs:
      plugins:
        description: 'Plugins to rebuild — "all", or comma-separated names'
        type: string
        default: 'all'
    secrets:
      PLUGIN_BUILD_PAT:
        description: 'PAT with Actions: write on the plugin repos'
        required: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger release workflow on plugin repos
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_BUILD_PAT }}
          SELECTION: ${{ inputs.plugins }}
        run: |
          owner="AlienXAXS"

          # "<selection name>:<repo name>" — most repos are StarRupture-Plugin-<name>,
          # but not all of them, so the repo is spelled out rather than derived.
          known=(
            "BetterCheats:StarRupture-Plugin-BetterCheats"
            "BetterDrone:StarRupture-Plugin-BetterDrone"
            "BetterMap:StarRupture-Plugin-BetterMap"
            "BetterSaving:StarRupture-Plugin-BetterSaving"
            "Codex:StarRupture-Plugin-Codex"
            "Compass:StarRupture-Plugin-Compass"
            "KeepTicking:StarRupture-Plugin-KeepTicking"
            "ProductionViewer:StarRupture-Plugin-ProductionViewer"
            "ServerUtility:StarRupture-Plugin-ServerUtility"
            "AxRuptureTimer:StarRupture-Plugin-RuptureTimer"
            "WAILA:StarRupture-Plugin-WAILA"
            "WaveOptimiser:StarRupture-Plugin-WaveOptimiser"
          )

          names=()
          for entry in "${known[@]}"; do names+=("${entry%%:*}"); done

          # Resolve the selection against the known list. Names are matched
          # case-insensitively so a manual dispatch does not have to get the
          # camel casing exactly right.
          if [ -z "$SELECTION" ] || [ "${SELECTION,,}" = "all" ]; then
            selected=("${known[@]}")
          else
            selected=()
            IFS=',' read -ra requested <<< "$SELECTION"
            for raw in "${requested[@]}"; do
              name="$(echo "$raw" | tr -d '[:space:]')"
              [ -z "$name" ] && continue
              match=""
              for entry in "${known[@]}"; do
                candidate="${entry%%:*}"
                if [ "${candidate,,}" = "${name,,}" ]; then match="$entry"; fi
              done
              if [ -z "$match" ]; then
                echo "::error::Unknown plugin '$name'. Known plugins: ${names[*]}"
                exit 1
              fi
              selected+=("$match")
            done
            if [ ${#selected[@]} -eq 0 ]; then
              echo "::error::No plugins selected."
              exit 1
            fi
          fi

          echo "Triggering ${#selected[@]} plugin repo(s):"
          for entry in "${selected[@]}"; do echo "  ${entry%%:*} -> $owner/${entry#*:}"; done

          # Do not let one bad repo abort the rest of the list (step runs under bash -e)
          failed=()
          for entry in "${selected[@]}"; do
            name="${entry%%:*}"
            repo="$owner/${entry#*:}"
            echo "Triggering release workflow on $repo"
            if ! gh workflow run release.yml --repo "$repo"; then
              echo "::warning::Failed to trigger release workflow on $repo"
              failed+=("$name")
            fi
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to trigger ${#failed[@]} plugin repo(s): ${failed[*]}"
            exit 1
          fi

          echo "Triggered ${#selected[@]} plugin repo(s) successfully."
