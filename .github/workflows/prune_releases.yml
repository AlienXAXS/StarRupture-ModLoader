name: Delete all releases and tags except the latest and the one before it

# Keeps the release GitHub marks as "Latest" (newest non-draft, non-prerelease)
# and the release before it (the next older non-draft, non-prerelease one), with
# their tags, so a broken Latest can be rolled back to. Every other release --
# prereleases included -- is deleted, followed by every other tag, whether or not
# it had a release.
#
# A draft is never deleted, and neither is the tag it will get. release.yml makes
# each release as a draft and publishes it only after its assets are checked, and
# a failed run leaves the draft for resume_tag to repair; deleting it here would
# pull the release out from under a run that is using it. A draft nobody wants is
# deleted by hand. The exception is a draft whose tag ends in "-draft": those are
# the branch builds of draft.yml, no release run uses them, and they go as before.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          latest=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "::error::No latest release found. Refusing to delete anything."
            exit 1
          fi
          echo "Keeping latest release: $latest"

          # Releases are deleted by id rather than by tag: a draft may have no
          # tag yet, and two drafts can share one.
          gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | [.id, .tag_name, .draft, .prerelease] | @tsv' > releases.tsv

          # The release before Latest: the first published, non-prerelease release
          # after it in the list, which GitHub returns newest first. A rollback
          # target must be one that was shipped.
          previous=$(awk -F'\t' -v latest="$latest" 'seen && $3 == "false" && $4 == "false" { print $2; exit } $2 == latest { seen = 1 }' releases.tsv)
          if [ -n "$previous" ]; then
            echo "Keeping the previous release: $previous"
          else
            echo "There is no release before the latest one to keep."
          fi
          echo

          # Drafts are kept (see the header), and so are the tags they will get.
          # The "-draft" ones are the branch builds of draft.yml: they are deleted
          # as before.
          awk -F'\t' '$3 == "true" && $2 !~ /-draft$/ { print $2 }' releases.tsv > draft-tags.txt
          if [ -s draft-tags.txt ]; then
            echo "Keeping $(wc -l < draft-tags.txt) draft release(s), left to the release run or to the owner: $(paste -sd' ' draft-tags.txt)"
          fi
          awk -F'\t' -v latest="$latest" -v previous="$previous" '$2 != latest && $2 != previous && ($3 != "true" || $2 ~ /-draft$/)' releases.tsv > delete-releases.tsv

          gh api --paginate "repos/$REPO/tags" --jq '.[].name' | sort -u > tags.txt
          # "$previous" is empty when there is none; an empty -e pattern would match
          # every tag, so the latest tag stands in for it.
          grep -vxF -e "$latest" -e "${previous:-$latest}" -f draft-tags.txt tags.txt > delete-tags.txt || true

          echo "Releases to delete ($(wc -l < delete-releases.tsv)):"
          while IFS=$'\t' read -r id tag draft pre; do
            flags=""
            [ "$draft" = "true" ] && flags="$flags draft"
            [ "$pre" = "true" ] && flags="$flags prerelease"
            echo "  $tag${flags:+ [$flags ]}"
          done < delete-releases.tsv
          echo

          echo "Tags to delete ($(wc -l < delete-tags.txt)):"
          sed 's/^/  /' delete-tags.txt
          echo

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. Nothing deleted."
            exit 0
          fi

          failed=0

          while IFS=$'\t' read -r id tag draft pre; do
            echo "Deleting release: $tag (id $id)"
            gh api -X DELETE "repos/$REPO/releases/$id" || { echo "::warning::Failed to delete release $tag"; failed=1; }
          done < delete-releases.tsv

          while IFS= read -r tag; do
            echo "Deleting tag: $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || { echo "::warning::Failed to delete tag $tag"; failed=1; }
          done < delete-tags.txt

          exit $failed
