name: Delete tags without releases

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print tags that would be deleted"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  delete-unused-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Delete tags without GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          echo "Fetching release tags..."
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort -u > release-tags.txt

          echo "Fetching git tags..."
          git tag -l | sort -u > git-tags.txt

          echo "Finding tags with no matching GitHub Release..."
          comm -23 git-tags.txt release-tags.txt > unused-tags.txt

          if [ ! -s unused-tags.txt ]; then
            echo "No tags without releases found."
            exit 0
          fi

          echo "Tags without releases:"
          cat unused-tags.txt

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled. No tags deleted."
            exit 0
          fi

          while IFS= read -r tag; do
            echo "Deleting tag: $tag"
            git tag -d "$tag" || true
            git push origin ":refs/tags/$tag"
          done < unused-tags.txt