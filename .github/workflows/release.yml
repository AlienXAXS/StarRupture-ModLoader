name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3) — leave blank to auto-increment'
        type: string
        default: ''
      preview:
        description: 'Preview release — custom tag suffix, marks as pre-release, skips Nexus upload'
        type: boolean
        default: false
      preview_tag:
        description: 'Preview tag suffix (e.g. beta.1, rc.1) — only used when Preview is enabled'
        type: string
        default: 'preview'
      sync_plugin_sdk:
        description: 'Sync Plugin SDK repo (header, DLLs, release)?'
        type: boolean
        default: false
      sync_only:
        description: 'Sync Plugin SDK only — skip build and release, sync latest release to SDK repo'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.event.inputs.sync_only != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create releases and upload assets
    outputs:
      tag:        ${{ steps.tag.outputs.TAG }}
      is_preview: ${{ steps.tag.outputs.IS_PREVIEW }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Parse-Semver([string]$v) {
            if ($v -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              return @{
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
            return $null
          }

          function Compare-Semver($a, $b) {
            if ($a.Major -lt $b.Major) { return -1 }
            if ($a.Major -gt $b.Major) { return  1 }

            if ($a.Minor -lt $b.Minor) { return -1 }
            if ($a.Minor -gt $b.Minor) { return  1 }

            if ($a.Patch -lt $b.Patch) { return -1 }
            if ($a.Patch -gt $b.Patch) { return  1 }

            return 0
          }

          function Format-Semver($v) {
            return "v$($v.Major).$($v.Minor).$($v.Patch)"
          }

          $latestParsed = $null
          $releaseTags = gh release list --limit 100 --json tagName |
            ConvertFrom-Json |
            Select-Object -ExpandProperty tagName |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }

          foreach ($t in $releaseTags) {
            $parsed = Parse-Semver $t
            if ($parsed -and ($latestParsed -eq $null -or (Compare-Semver $parsed $latestParsed) -gt 0)) {
              $latestParsed = $parsed
            }
          }

          if ($latestParsed -eq $null) {
            Write-Host "No semver tags found, bootstrapping from v0.0.0"
            $latestParsed = @{ Major = 0; Minor = 0; Patch = 0 }
          } else {
            Write-Host "Latest semver tag: $(Format-Semver $latestParsed)"
          }

          # bump MINOR, reset PATCH
          $autoParsed = @{
            Major = $latestParsed.Major
            Minor = $latestParsed.Minor + 1
            Patch = 0
          }

          $versionFile = Join-Path $env:GITHUB_WORKSPACE "version"
          $fileParsed = $null

          if (Test-Path $versionFile) {
            $raw = (Get-Content $versionFile -Raw).Trim()
            $fileParsed = Parse-Semver $raw

            if ($fileParsed) {
              Write-Host "version file specifies: $raw"
            } else {
              Write-Warning "version file '$raw' is not valid semver, ignoring."
            }
          }

          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          $inputParsed  = $null
          if ($inputVersion -ne '') {
            $inputParsed = Parse-Semver $inputVersion
            if ($inputParsed) {
              Write-Host "Workflow input specifies: $inputVersion (override — skipping file and auto-increment)"
            } else {
              Write-Warning "Workflow input '$inputVersion' is not valid semver, ignoring."
            }
          }

          $chosen = $autoParsed
          if ($inputParsed) {
            $chosen = $inputParsed
            Write-Host "Input version wins."
          } elseif ($fileParsed -and (Compare-Semver $fileParsed $autoParsed) -gt 0) {
            $chosen = $fileParsed
            Write-Host "version file is higher, using it."
          } else {
            Write-Host "Auto-increment minor wins."
          }

          Write-Host "DEBUG latest = $(Format-Semver $latestParsed)"
          Write-Host "DEBUG auto   = $(Format-Semver $autoParsed)"
          if ($fileParsed) {
            Write-Host "DEBUG file   = $(Format-Semver $fileParsed)"
          } else {
            Write-Host "DEBUG file   = <none>"
          }
          if ($inputParsed) {
            Write-Host "DEBUG input  = $(Format-Semver $inputParsed)"
          } else {
            Write-Host "DEBUG input  = <none>"
          }
          Write-Host "DEBUG chosen = $(Format-Semver $chosen)"

          $tag = Format-Semver $chosen
          $isPreview = "${{ github.event.inputs.preview }}" -eq 'true'
          if ($isPreview) {
            $suffix = "${{ github.event.inputs.preview_tag }}".Trim()
            if ($suffix -eq '') { $suffix = 'preview' }
            $tag = "$tag-$suffix"
          }
          Write-Host "Final tag: $tag"
          echo "TAG=$tag"          >> $env:GITHUB_OUTPUT
          echo "IS_PREVIEW=$($isPreview.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Patch version.rc with release tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}" -replace '^v','' -replace '[-+].*$',''
          $parts = $tag -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          $commas  = $parts[0..3] -join ','
          $dots    = $parts[0..3] -join '.'

          # Both DLLs (proxy + Core) ship their own version.rc and should carry
          # the same release version.
          foreach ($rcPath in @("StarRupture-ModLoader-Proxy\version.rc", "StarRupture-ModLoader-Core\version.rc")) {
            $rc = Get-Content $rcPath -Raw
            $rc = $rc -replace 'FILEVERSION\s+[\d,]+',    "FILEVERSION     $commas"
            $rc = $rc -replace 'PRODUCTVERSION\s+[\d,]+', "PRODUCTVERSION  $commas"
            $rc = $rc -replace '"FileVersion",\s+"[^"]*"',    "`"FileVersion`",      `"$dots`""
            $rc = $rc -replace '"ProductVersion",\s+"[^"]*"', "`"ProductVersion`",   `"$dots`""
            Set-Content $rcPath $rc -Encoding UTF8NoBOM
            Write-Host "$rcPath patched to $dots"
          }

      - name: Build Client Release
        run: |
          msbuild "StarRupture-ModLoader.sln" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="${{ steps.tag.outputs.TAG }}" `
            /p:AutoUpdateManifestUrl="https://github.com/${{ github.repository }}/releases/latest/download/manifest-client.json" `
            /m `
            /v:minimal

      - name: Build Server Release
        run: |
          msbuild "StarRupture-ModLoader.sln" `
            /p:Configuration="Server Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="${{ steps.tag.outputs.TAG }}" `
            /p:AutoUpdateManifestUrl="https://github.com/${{ github.repository }}/releases/latest/download/manifest-server.json" `
            /m `
            /v:minimal

      - name: Stage dwmapi.dll artifacts for SDK sync
        shell: pwsh
        run: |
          Copy-Item "build\Client Release\dwmapi.dll" "dwmapi-Client.dll"
          Copy-Item "build\Server Release\dwmapi.dll" "dwmapi-Server.dll"

      - name: Upload dwmapi.dll artifacts for SDK sync
        uses: actions/upload-artifact@v4
        with:
          name: modloader-dlls
          path: |
            dwmapi-Client.dll
            dwmapi-Server.dll
          retention-days: 1

      - name: Generate all release assets
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $repo = "${{ github.repository }}"
          $ws   = $env:GITHUB_WORKSPACE

          # Read interface version constants from the header so they never drift
          # out of sync with what was actually compiled.
          $header = Get-Content "$ws\StarRupture-ModLoader-Core\plugins\plugin_interface.h" -Raw
          $matchMin = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MIN\s+(\d+)')
          $matchMax = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)')
          if (-not $matchMin.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MIN in plugin_interface.h" }
          if (-not $matchMax.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MAX in plugin_interface.h" }
          $ifaceMin = [int]$matchMin.Groups[1].Value
          $ifaceMax = [int]$matchMax.Groups[1].Value
          Write-Host "Interface version range: [$ifaceMin, $ifaceMax]"

          # ---------------------------------------------------------------------------
          # 1. Modloader manifests  (central version check — no plugin list)
          # ---------------------------------------------------------------------------
          foreach ($variant in @("client", "server")) {
            $manifest = [ordered]@{ build_tag = $tag }
            $out = "$ws\manifest-$variant.json"
            $manifest | ConvertTo-Json -Depth 1 | Out-File $out -Encoding utf8NoBOM
            Write-Host "Generated modloader manifest: $out"
            Get-Content $out
          }

          # ---------------------------------------------------------------------------
          # 2. Modloader ZIPs  (dwmapi.dll only — plugins are shipped separately)
          # ---------------------------------------------------------------------------
          foreach ($variant in @("Client", "Server")) {
            $stagingDir = "$ws\staging\modloader\$variant"
            New-Item -ItemType Directory -Force $stagingDir | Out-Null

            Copy-Item "build\$variant Release\dwmapi.dll" "$stagingDir\dwmapi.dll"

            $pdb = "build\$variant Release\dwmapi.pdb"
            if (Test-Path $pdb) { Copy-Item $pdb "$stagingDir\dwmapi.pdb" }

            $modloaderDst = "$stagingDir\ModLoader"
            New-Item -ItemType Directory -Force $modloaderDst | Out-Null
            Set-Content "$modloaderDst\readme.txt" "Plugins, Logs and Configs have moved here.  Your existing plugins and configs will be migrated here when you start the game" -Encoding utf8NoBOM

            $modloaderSrc = "build\$variant Release\ModLoader"
            if (Test-Path $modloaderSrc) {
              Copy-Item "$modloaderSrc\*.dll" $modloaderDst -ErrorAction SilentlyContinue
              Copy-Item "$modloaderSrc\*.pdb" $modloaderDst -ErrorAction SilentlyContinue
              # Self-update helper exe (client only -- the proxy spawns it
              # before loading Core to check for / install modloader updates)
              if ($variant -eq "Client") {
                Copy-Item "$modloaderSrc\StarRupture-ModLoader-Updater.exe" $modloaderDst -ErrorAction SilentlyContinue
              }
            }

            $zipPath = "$ws\StarRupture-ModLoader-$variant-$tag.zip"
            & "C:\Program Files\7-Zip\7z.exe" a -tzip $zipPath "$stagingDir\*" | Out-Null
            Write-Host "Created modloader ZIP: $zipPath"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $ws  = $env:GITHUB_WORKSPACE

          $assets = [System.Collections.Generic.List[string]]::new()

          # Modloader ZIPs
          Get-ChildItem "$ws\StarRupture-ModLoader-*-$tag.zip" | ForEach-Object { $assets.Add($_.FullName) }

          # Modloader manifests
          $assets.Add("$ws\manifest-client.json")
          $assets.Add("$ws\manifest-server.json")

          # Per-plugin ZIPs
          Get-ChildItem "$ws\*-Client-$tag.zip", "$ws\*-Server-$tag.zip" |
            Where-Object { $_.Name -notlike "StarRupture-ModLoader-*" } |
            ForEach-Object { $assets.Add($_.FullName) }

          # Per-plugin update manifests
          Get-ChildItem "$ws\*-client-manifest.json", "$ws\*-server-manifest.json" |
            ForEach-Object { $assets.Add($_.FullName) }

          Write-Host "Uploading $($assets.Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }

          $flags = @('--title', "StarRupture ModLoader $tag", '--generate-notes')
          if ("${{ steps.tag.outputs.IS_PREVIEW }}" -eq 'true') {
            $flags += '--prerelease'
          }
          gh release create $tag @assets @flags

      - name: Upload Client build to Nexus Mods
        if: ${{ steps.tag.outputs.IS_PREVIEW != 'true' }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          file_id: ${{ secrets.NEXUS_SR_ML_CLIENT_GROUP_ID }}
          filename: ${{ github.workspace }}\StarRupture-ModLoader-Client-${{ steps.tag.outputs.TAG }}.zip
          archive_existing_version: true
          allow_mod_manager_download: false
          display_name: "StarRupture ModLoader Client ${{ steps.tag.outputs.TAG }}"
          description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.TAG }}

      - name: Upload Server build to Nexus Mods
        if: ${{ steps.tag.outputs.IS_PREVIEW != 'true' }}
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          file_id: ${{ secrets.NEXUS_SR_ML_SERVER_GROUP_ID }}
          filename: ${{ github.workspace }}\StarRupture-ModLoader-Server-${{ steps.tag.outputs.TAG }}.zip
          archive_existing_version: true
          allow_mod_manager_download: false
          display_name: "StarRupture ModLoader Server ${{ steps.tag.outputs.TAG }}"
          description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.TAG }}

  sync-plugin-sdk:
    needs: build
    if: |
      always() &&
      (github.event.inputs.sync_plugin_sdk == 'true' || github.event.inputs.sync_only == 'true') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      needs.build.outputs.is_preview != 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Resolve tag and DLL source
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if ($env:BUILD_TAG -and $env:BUILD_TAG -ne '') {
            # Fresh build — tag came from the build job
            Write-Host "Using tag from build job: $env:BUILD_TAG"
            echo "TAG=$env:BUILD_TAG" >> $env:GITHUB_OUTPUT
            echo "FROM_ARTIFACT=true"  >> $env:GITHUB_OUTPUT
          } else {
            # Sync-only — fetch the latest release tag from this repo
            $tag = gh release list --repo ${{ github.repository }} --limit 1 --json tagName |
              ConvertFrom-Json |
              Select-Object -ExpandProperty tagName
            if (-not $tag) { Write-Error "No releases found to sync."; exit 1 }
            Write-Host "Sync-only mode — using latest release tag: $tag"
            echo "TAG=$tag"           >> $env:GITHUB_OUTPUT
            echo "FROM_ARTIFACT=false" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout plugin SDK repo
        uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk

      - name: Download pre-built dwmapi.dll artifacts (from build job)
        if: ${{ steps.resolve.outputs.FROM_ARTIFACT == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: modloader-dlls
          path: modloader-dlls

      - name: Download pre-built dwmapi.dll artifacts (from latest release)
        if: ${{ steps.resolve.outputs.FROM_ARTIFACT == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.TAG }}"
          New-Item -ItemType Directory -Force modloader-dlls | Out-Null
          gh release download $tag `
            --repo ${{ github.repository }} `
            --pattern "dwmapi-Client.dll" `
            --pattern "dwmapi-Server.dll" `
            --dir modloader-dlls
          Write-Host "Downloaded DLLs from release $tag"

      - name: Sync headers into plugin SDK repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "sdk\include" | Out-Null
          Copy-Item "main\StarRupture-ModLoader-Core\plugins\plugin_interface.h" "sdk\include\plugin_interface.h" -Force
          Write-Host "Sync complete."

      - name: Commit and push to SDK repo
        shell: pwsh
        run: |
          cd sdk
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          $diff = git diff --cached --name-only
          if (-not $diff) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Sync from modloader ${{ steps.resolve.outputs.TAG }}"
          git push

      - name: Create SDK release with pre-built dwmapi.dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_PAT }}
        run: |
          $tag = "${{ steps.resolve.outputs.TAG }}"

          Copy-Item "modloader-dlls\dwmapi-Client.dll" "dwmapi-Client.dll"
          Copy-Item "modloader-dlls\dwmapi-Server.dll" "dwmapi-Server.dll"

          cd sdk
          gh release create $tag `
            --repo AlienXAXS/StarRupture-Plugin-SDK `
            --title "Plugin SDK $tag" `
            --notes "Auto-synced from modloader $tag.`n`nDownload ``dwmapi-Client.dll`` or ``dwmapi-Server.dll`` to test your plugin locally (rename to ``dwmapi.dll`` before deploying)." `
            "..\dwmapi-Client.dll" `
            "..\dwmapi-Server.dll"
