name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3) — leave blank to auto-increment'
        type: string
        default: ''
      preview:
        description: 'Preview release — custom tag suffix, marks as pre-release, skips Nexus upload'
        type: boolean
        default: false
      preview_tag:
        description: 'Preview tag suffix (e.g. beta.1, rc.1) — only used when Preview is enabled'
        type: string
        default: 'preview'
      sync_plugin_sdk:
        description: 'Sync Plugin SDK repo (header, DLLs, release)?'
        type: boolean
        default: false
      sync_only:
        description: 'Sync Plugin SDK only — skip build and release, sync latest release to SDK repo'
        type: boolean
        default: false
      auto_build_plugins:
        description: 'Auto Build Plugins — rebuild all plugin repos after this release, each against the SDK tag its release.yml pins (not the one this run creates)'
        type: boolean
        default: false
      resume_tag:
        description: 'Resume a release that is a draft or already public (e.g. v1.2.3) — never bumps the version or makes a new release. A draft with a missing or wrong asset is rebuilt whole from its commit, then published; a public release is checked and its Nexus and version map steps run (one with a missing or wrong asset is refused). Leave blank for a normal release'
        type: string
        default: ''
      resume_nexus:
        description: 'Resume only — which Nexus uploads to run. Use server-only when the Client file is already on Nexus (a repeat adds a second changelog entry), none when Nexus was done by hand'
        type: choice
        options: [both, server-only, none]
        default: both

# The release is made as a draft, holds every asset and passes the check while
# nothing is public (the loader's update manifest URL points at the Latest
# release), and only then is published. A failure before that counts as nothing:
# run again. A failure after it is public is finished with resume_tag, which
# never makes another release. One run at a time, so a resume waits for the run
# it follows.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event.inputs.sync_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to read: the releases list shows drafts to a token with push access
    outputs:
      tag:        ${{ steps.tag.outputs.TAG || steps.resume.outputs.TAG }}
      is_preview: ${{ steps.tag.outputs.IS_PREVIEW || steps.resume.outputs.IS_PREVIEW }}
      # new (a fresh run), draft or public (a resume)
      state:      ${{ steps.tag.outputs.STATE || steps.resume.outputs.STATE }}
      # the commit a build and the draft are made from
      sha:        ${{ steps.tag.outputs.SHA || steps.resume.outputs.SHA }}
      draft_id:   ${{ steps.resume.outputs.DRAFT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Resume: the release is a draft (nothing public) or already public. Nothing
      # below this step computes a version or makes a release or a tag.
      - name: Find the release to resume
        id: resume
        if: ${{ github.event.inputs.resume_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_TAG: ${{ github.event.inputs.resume_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RESUME_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::resume_tag '$RESUME_TAG' is not a release tag like v1.2.3."
            exit 1
          fi
          found=$(node .github/scripts/release-check.mjs find --repo "$GITHUB_REPOSITORY" --tag "$RESUME_TAG")
          state=$(jq -r .state <<< "$found")
          sha=
          case "$state" in
            public) ;;
            draft)
              # The commit the draft was made on; a rebuild takes its sources from it.
              sha=$(jq -r .target <<< "$found")
              if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Draft $RESUME_TAG targets '$sha', not a commit, so a rebuild could not tell what to build. Nothing was changed. Deleting the draft by hand is the owner's call."
                exit 1
              fi ;;
            ambiguous)
              echo "::error::More than one draft has the tag $RESUME_TAG, so it is not clear which one to resume. Nothing was changed. Deleting the extra drafts by hand is the owner's call."
              exit 1 ;;
            *)
              echo "::error::There is no release or draft for $RESUME_TAG, so there is nothing to resume. Nothing was changed. A release that never reached a draft is made by running this workflow again without resume_tag (a tag left behind by it has to be removed by hand first)."
              exit 1 ;;
          esac
          prerelease=$(jq -r .prerelease <<< "$found")
          echo "Resuming $RESUME_TAG ($state, preview: $prerelease). No version is bumped and no new release is made."
          {
            echo "TAG=$RESUME_TAG"
            echo "IS_PREVIEW=$prerelease"
            echo "STATE=$state"
            echo "SHA=$sha"
            echo "DRAFT_ID=$(jq -r .id <<< "$found")"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: tag
        if: ${{ github.event.inputs.resume_tag == '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Parse-Semver([string]$v) {
            if ($v -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              return @{
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
            return $null
          }

          function Compare-Semver($a, $b) {
            if ($a.Major -lt $b.Major) { return -1 }
            if ($a.Major -gt $b.Major) { return  1 }

            if ($a.Minor -lt $b.Minor) { return -1 }
            if ($a.Minor -gt $b.Minor) { return  1 }

            if ($a.Patch -lt $b.Patch) { return -1 }
            if ($a.Patch -gt $b.Patch) { return  1 }

            return 0
          }

          function Format-Semver($v) {
            return "v$($v.Major).$($v.Minor).$($v.Patch)"
          }

          $latestParsed = $null
          $releaseTags = gh release list --limit 100 --json tagName |
            ConvertFrom-Json |
            Select-Object -ExpandProperty tagName |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }

          foreach ($t in $releaseTags) {
            $parsed = Parse-Semver $t
            if ($parsed -and ($latestParsed -eq $null -or (Compare-Semver $parsed $latestParsed) -gt 0)) {
              $latestParsed = $parsed
            }
          }

          if ($latestParsed -eq $null) {
            Write-Host "No semver tags found, bootstrapping from v0.0.0"
            $latestParsed = @{ Major = 0; Minor = 0; Patch = 0 }
          } else {
            Write-Host "Latest semver tag: $(Format-Semver $latestParsed)"
          }

          # bump PATCH, keep MAJOR/MINOR (raise those via the version file or input)
          $autoParsed = @{
            Major = $latestParsed.Major
            Minor = $latestParsed.Minor
            Patch = $latestParsed.Patch + 1
          }

          $versionFile = Join-Path $env:GITHUB_WORKSPACE "version"
          $fileParsed = $null

          if (Test-Path $versionFile) {
            $raw = (Get-Content $versionFile -Raw).Trim()
            $fileParsed = Parse-Semver $raw

            if ($fileParsed) {
              Write-Host "version file specifies: $raw"
            } else {
              Write-Warning "version file '$raw' is not valid semver, ignoring."
            }
          }

          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          $inputParsed  = $null
          if ($inputVersion -ne '') {
            $inputParsed = Parse-Semver $inputVersion
            if ($inputParsed) {
              Write-Host "Workflow input specifies: $inputVersion (override — skipping file and auto-increment)"
            } else {
              Write-Warning "Workflow input '$inputVersion' is not valid semver, ignoring."
            }
          }

          $chosen = $autoParsed
          if ($inputParsed) {
            $chosen = $inputParsed
            Write-Host "Input version wins."
          } elseif ($fileParsed -and (Compare-Semver $fileParsed $autoParsed) -gt 0) {
            $chosen = $fileParsed
            Write-Host "version file is higher, using it."
          } else {
            Write-Host "Auto-increment patch wins."
          }

          Write-Host "DEBUG latest = $(Format-Semver $latestParsed)"
          Write-Host "DEBUG auto   = $(Format-Semver $autoParsed)"
          if ($fileParsed) {
            Write-Host "DEBUG file   = $(Format-Semver $fileParsed)"
          } else {
            Write-Host "DEBUG file   = <none>"
          }
          if ($inputParsed) {
            Write-Host "DEBUG input  = $(Format-Semver $inputParsed)"
          } else {
            Write-Host "DEBUG input  = <none>"
          }
          Write-Host "DEBUG chosen = $(Format-Semver $chosen)"

          $tag = Format-Semver $chosen
          $isPreview = "${{ github.event.inputs.preview }}" -eq 'true'
          if ($isPreview) {
            $suffix = "${{ github.event.inputs.preview_tag }}".Trim()
            if ($suffix -eq '') { $suffix = 'preview' }
            $tag = "$tag-$suffix"
          }
          Write-Host "Final tag: $tag"

          # A tag that is already there means this release was made, or half made.
          # Never make it again: resume_tag finishes it.
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          $tagExists = ($LASTEXITCODE -eq 0)
          # ls-remote exits 2 when the tag is absent, which is the normal case; the
          # runner ends a pwsh step with $LASTEXITCODE, so clear it.
          $global:LASTEXITCODE = 0
          if ($tagExists) {
            throw "Tag $tag already exists, so this run would not be a new release. If its release is public, finish it by running this workflow with resume_tag=$tag. If there is a tag but no release, the tag has to be removed by hand (the owner's call) before a new run can use it."
          }
          echo "TAG=$tag"          >> $env:GITHUB_OUTPUT
          echo "IS_PREVIEW=$($isPreview.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "STATE=new"         >> $env:GITHUB_OUTPUT
          echo "SHA=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

  # Client and Server build side by side. The release job below waits for both.
  # A new release builds the commit the run was started on. A resumed draft that
  # is missing an asset or holds a wrong one is rebuilt whole, from the commit the
  # draft was made on, with these same build flags.
  build:
    needs: [prepare, inspect]
    if: |
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.state == 'new' ||
       (needs.prepare.outputs.state == 'draft' && needs.inspect.outputs.complete == 'false'))
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        variant: [Client, Server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Patch version.rc with release tag
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}" -replace '^v','' -replace '[-+].*$',''
          $parts = $tag -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          $commas  = $parts[0..3] -join ','
          $dots    = $parts[0..3] -join '.'

          # Both DLLs (proxy + Core) ship their own version.rc and should carry
          # the same release version.
          foreach ($rcPath in @("StarRupture-ModLoader-Proxy\version.rc", "StarRupture-ModLoader-Core\version.rc")) {
            $rc = Get-Content $rcPath -Raw
            $rc = $rc -replace 'FILEVERSION\s+[\d,]+',    "FILEVERSION     $commas"
            $rc = $rc -replace 'PRODUCTVERSION\s+[\d,]+', "PRODUCTVERSION  $commas"
            $rc = $rc -replace '"FileVersion",\s+"[^"]*"',    "`"FileVersion`",      `"$dots`""
            $rc = $rc -replace '"ProductVersion",\s+"[^"]*"', "`"ProductVersion`",   `"$dots`""
            Set-Content $rcPath $rc -Encoding UTF8NoBOM
            Write-Host "$rcPath patched to $dots"
          }

      - name: Build Client Release
        if: ${{ matrix.variant == 'Client' }}
        run: |
          msbuild "StarRupture-ModLoader.sln" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="${{ needs.prepare.outputs.tag }}" `
            /p:AutoUpdateManifestUrl="https://github.com/${{ github.repository }}/releases/latest/download/manifest-client.json" `
            /p:VmapFeedUrl="https://github.com/${{ github.repository }}/releases/latest/download/version-map-client.v1.txt" `
            /m `
            /v:minimal

      - name: Build Server Release
        if: ${{ matrix.variant == 'Server' }}
        run: |
          msbuild "StarRupture-ModLoader.sln" `
            /p:Configuration="Server Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="${{ needs.prepare.outputs.tag }}" `
            /p:AutoUpdateManifestUrl="https://github.com/${{ github.repository }}/releases/latest/download/manifest-server.json" `
            /m `
            /v:minimal

      # A Client build whose Core DLL lacks the version object map URL or the release
      # key cannot fetch or verify the signed version map, and would ship that way
      # to every player. Fail here, before the build is uploaded and a release made.
      # The strings are in the DLL as plain text (VMAP_FEED_URL, kK<n>Hex).
      - name: Check the Client build carries the version map URL and key
        if: ${{ matrix.variant == 'Client' }}
        shell: bash
        env:
          DLL: build/Client Release/ModLoader/StarRupture-ModLoader-Core.dll
          KEY_SOURCE: StarRupture-ModLoader-Core/memory_scanner/version_feed.cpp
        run: |
          set -uo pipefail
          fail() { echo "::error title=Client build is missing the version map setting::$1 Nothing was uploaded and no release was made."; exit 1; }
          [ -s "$DLL" ] || fail "The built Core DLL was not found at $DLL."
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version-map-client.v1.txt"
          grep -qaF -- "$url" "$DLL" || fail "The Core DLL does not contain the version map URL $url (VmapFeedUrl)."
          # Every key slot that is not a TEST key and holds a key: its public key must be in the DLL.
          found=0
          for slot in 1 2; do
            hex=$(sed -n "s/.*kK${slot}Hex = \"\([0-9a-f]*\)\".*/\1/p" "$KEY_SOURCE")
            test_only=$(sed -n "s/.*kK${slot}TestOnly = \(true\|false\).*/\1/p" "$KEY_SOURCE")
            [ -n "$hex" ] && [ "$test_only" = "false" ] || continue
            found=$((found + 1))
            grep -qaF -- "$hex" "$DLL" || fail "The Core DLL does not contain the release public key of slot k$slot from $KEY_SOURCE."
          done
          [ "$found" -gt 0 ] || fail "$KEY_SOURCE names no release public key, so the build could not verify a version map."
          echo "The Core DLL carries the version map URL and $found release public key(s)."

      - name: Upload ${{ matrix.variant }} build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.variant }}
          path: build/${{ matrix.variant }} Release
          retention-days: 1

  # Makes the draft (a new release) or, for a resumed draft that was rebuilt,
  # replaces every asset on it with the files of this one build. Never public.
  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write  # Required to create the draft and upload assets
    outputs:
      tag:        ${{ needs.prepare.outputs.tag }}
      is_preview: ${{ needs.prepare.outputs.is_preview }}
      changelog:  ${{ steps.assets.outputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0  # build-versioned-notes.ps1 reads UPDATE_NOTES.txt from earlier tags

      - name: Download Client build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-Client
          path: build/Client Release

      - name: Download Server build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-Server
          path: build/Server Release

      - name: Stage dwmapi.dll artifacts for SDK sync
        shell: pwsh
        run: |
          Copy-Item "build\Client Release\dwmapi.dll" "dwmapi-Client.dll"
          Copy-Item "build\Server Release\dwmapi.dll" "dwmapi-Server.dll"

      - name: Upload dwmapi.dll artifacts for SDK sync
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modloader-dlls
          path: |
            dwmapi-Client.dll
            dwmapi-Server.dll
          retention-days: 1

      - name: Generate all release assets
        id: assets
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $ws   = $env:GITHUB_WORKSPACE

          # Read interface version constants from the header so they never drift
          # out of sync with what was actually compiled.
          $header = Get-Content "$ws\StarRupture-ModLoader-Core\plugins\plugin_interface.h" -Raw
          $matchMin = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MIN\s+(\d+)')
          $matchMax = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)')
          if (-not $matchMin.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MIN in plugin_interface.h" }
          if (-not $matchMax.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MAX in plugin_interface.h" }
          $ifaceMin = [int]$matchMin.Groups[1].Value
          $ifaceMax = [int]$matchMax.Groups[1].Value
          Write-Host "Interface version range: [$ifaceMin, $ifaceMax]"

          # ---------------------------------------------------------------------------
          # 1. Modloader manifests  (central version check — no plugin list)
          # ---------------------------------------------------------------------------
          # Player-facing notes: one change per line in UPDATE_NOTES.txt, this
          # release's lines only (the release body and the changelog use just
          # these). The loader lists the full text in its "Plugins Updated"
          # window after the update, from the manifest's "release_notes" field.
          $notesFile = "$ws\UPDATE_NOTES.txt"
          $noteLines = @()
          if (Test-Path $notesFile) {
            $noteLines = @(Get-Content $notesFile | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }

          # A player can jump over releases, so "release_notes" holds one section per
          # release, newest first, each under a "## <tag>" header: this release's
          # UPDATE_NOTES.txt on top, then the UPDATE_NOTES.txt of earlier release
          # tags (taken from the tags, nothing to keep by hand). The loader lists
          # only the sections newer than the version the player had. The script
          # skips tags with no notes file and says which; it bounds the history
          # to 10 releases and 64 KB.
          $history = & "$ws\.github\scripts\build-versioned-notes.ps1" -Repo $ws -Version $tag
          if ($history.Truncated -gt 0) {
            Write-Host "::notice title=Release notes bounded::$($history.Truncated) older release(s) left out of release_notes (limit 10 releases, 64 KB)."
          }
          # A checkout without the tags would give a history of one release and
          # no sign of it: stop before anything is published.
          if ($history.Included.Count -lt 2) {
            throw "Release notes history has $($history.Included.Count) release(s) ($($history.Included -join ', ')); the checkout is missing the release tags."
          }
          $releaseNotes = $history.Text

          # The Windows "Update Available" box on older and current loaders prints
          # the manifest's "notes" field in full, so that field carries a short
          # text of its own: UPDATE_NOTES_SHORT.txt, one change per line. It is
          # never filled from UPDATE_NOTES.txt. A release stops here, before
          # anything is published, when it is missing, empty or too long, or when
          # it or UPDATE_NOTES.txt is word for word the previous release tag's
          # copy (text nobody rewrote for this release). A preview run only warns
          # and leaves "notes" out.
          $isPreview = "${{ needs.prepare.outputs.is_preview }}" -eq 'true'
          $check = & "$ws\.github\scripts\check-update-notes-short.ps1" -Path "$ws\UPDATE_NOTES_SHORT.txt"
          $shortText = $check.Text
          if ($check.Problem) {
            if (-not $isPreview) { throw "$($check.Problem)." }
            $title = if ($check.Kind -eq 'Empty') { 'Update box notes missing' } else { 'Update box notes too long' }
            Write-Host "::warning title=$title::$($check.Problem), so the manifest has no short 'notes' and the Windows update box will list no changes."
            $shortText = ""
          }

          if (-not $isPreview) {
            $curKey = [version](($tag -replace '^[vV]', '') -replace '-.*$', '')
            $prevTag = @(git -C $ws tag | Where-Object { $_ -match '^v?\d+\.\d+\.\d+$' } |
                         Where-Object { [version]($_ -replace '^[vV]', '') -lt $curKey } |
                         Sort-Object -Descending -Property { [version]($_ -replace '^[vV]', '') } |
                         Select-Object -First 1)
            foreach ($name in @('UPDATE_NOTES.txt', 'UPDATE_NOTES_SHORT.txt')) {
              # A previous tag without the file is not a match.
              if ($prevTag.Count -eq 0 -or -not (Test-Path "$ws\$name") -or -not (git -C $ws ls-tree --name-only $prevTag[0] -- $name)) { continue }
              $trim = { param($lines) @($lines | ForEach-Object { $_.Trim([char]0xFEFF, ' ', "`t", "`r") } | Where-Object { $_ }) -join "`n" }
              if ((& $trim (Get-Content "$ws\$name" -Encoding UTF8)) -ceq (& $trim (git -C $ws show "$($prevTag[0]):$name"))) {
                throw "$name is the same as at $($prevTag[0]); write the text for $tag before releasing."
              }
            }
          }

          # The same lines are the Nexus changelog entry for this version.
          $changelog = if ($noteLines.Count -gt 0) { $noteLines -join "`n" } else { "See https://github.com/$repo/releases/tag/$tag" }
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<$delim`n$changelog`n$delim"

          foreach ($variant in @("client", "server")) {
            $manifest = [ordered]@{ build_tag = $tag }
            if ($shortText) {
              $manifest["notes"] = $shortText
            }
            if ($releaseNotes) {
              $manifest["release_notes"] = $releaseNotes
            }
            $out = "$ws\manifest-$variant.json"
            $manifest | ConvertTo-Json -Depth 1 | Out-File $out -Encoding utf8NoBOM
            Write-Host "Generated modloader manifest: $out"
            Get-Content $out
          }

          # ---------------------------------------------------------------------------
          # 2. Modloader ZIPs  (dwmapi.dll only — plugins are shipped separately)
          # ---------------------------------------------------------------------------
          foreach ($variant in @("Client", "Server")) {
            $stagingDir = "$ws\staging\modloader\$variant"
            New-Item -ItemType Directory -Force $stagingDir | Out-Null

            Copy-Item "build\$variant Release\dwmapi.dll" "$stagingDir\dwmapi.dll"

            $pdb = "build\$variant Release\dwmapi.pdb"
            if (Test-Path $pdb) { Copy-Item $pdb "$stagingDir\dwmapi.pdb" }

            $modloaderDst = "$stagingDir\ModLoader"
            New-Item -ItemType Directory -Force $modloaderDst | Out-Null
            Set-Content "$modloaderDst\readme.txt" "Plugins, Logs and Configs have moved here.  Your existing plugins and configs will be migrated here when you start the game" -Encoding utf8NoBOM

            $modloaderSrc = "build\$variant Release\ModLoader"
            if (Test-Path $modloaderSrc) {
              Copy-Item "$modloaderSrc\*.dll" $modloaderDst -ErrorAction SilentlyContinue
              Copy-Item "$modloaderSrc\*.pdb" $modloaderDst -ErrorAction SilentlyContinue
              # Self-update helper exe (client only -- the proxy spawns it
              # before loading Core to check for / install modloader updates)
              if ($variant -eq "Client") {
                Copy-Item "$modloaderSrc\StarRupture-ModLoader-Updater.exe" $modloaderDst -ErrorAction SilentlyContinue
              }
            }

            $zipPath = "$ws\StarRupture-ModLoader-$variant-$tag.zip"
            & "C:\Program Files\7-Zip\7z.exe" a -tzip $zipPath "$stagingDir\*" | Out-Null
            Write-Host "Created modloader ZIP: $zipPath"
          }

      # The release is made with the signed version object map on it, from the same
      # place and through the same check as vmap-publish.yml, so a Latest release is
      # never without one (the loader reads it from the Latest release). A map that
      # is missing or does not verify stops the run here, before any release exists:
      # nothing is public, so it counts as nothing and the run can be started again.
      # A preview is never Latest and gets none.
      - name: Fetch the signed version map for the release
        if: ${{ needs.prepare.outputs.is_preview != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_REPO: msantoro12/starrupture-ci
          FEED_RELEASE: vmap-feed
          FEED_ASSET: version-map-client.v1.txt
        run: |
          set -uo pipefail
          rm -f "$FEED_ASSET"
          fail() {
            rm -f "$FEED_ASSET"
            echo "::error title=No version map for the release::$1 No release was made. Run this workflow again once the signed version map is there."
            exit 1
          }
          gh release download "$FEED_RELEASE" --repo "$FEED_REPO" --pattern "$FEED_ASSET" --dir . --clobber \
            || fail "The signed version map could not be downloaded from release $FEED_RELEASE in $FEED_REPO."
          node .github/vmap/verify-feed.mjs "$FEED_ASSET" --source StarRupture-ModLoader-Core/memory_scanner/version_feed.cpp --refuse-test-key \
            || fail "The signed version map from $FEED_REPO does not verify (reason above)."

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STATE: ${{ needs.prepare.outputs.state }}
          DRAFT_ID: ${{ needs.prepare.outputs.draft_id }}
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $ws  = $env:GITHUB_WORKSPACE

          $assets = [System.Collections.Generic.List[string]]::new()

          # Modloader ZIPs
          Get-ChildItem "$ws\StarRupture-ModLoader-*-$tag.zip" | ForEach-Object { $assets.Add($_.FullName) }

          # Modloader manifests
          $assets.Add("$ws\manifest-client.json")
          $assets.Add("$ws\manifest-server.json")

          # Per-plugin ZIPs
          Get-ChildItem "$ws\*-Client-$tag.zip", "$ws\*-Server-$tag.zip" |
            Where-Object { $_.Name -notlike "StarRupture-ModLoader-*" } |
            ForEach-Object { $assets.Add($_.FullName) }

          # Per-plugin update manifests
          Get-ChildItem "$ws\*-client-manifest.json", "$ws\*-server-manifest.json" |
            ForEach-Object { $assets.Add($_.FullName) }

          # The release carries the list of what it should hold, with each file's
          # size and md5, written from the list above. release-check.mjs reads it
          # back to tell a whole release from a half-made one.
          $manifest = "$ws\release-assets.json"
          node "$ws\.github\scripts\release-check.mjs" write-manifest --tag $tag --out $manifest @assets
          if ($LASTEXITCODE -ne 0) { throw "release-assets.json could not be written." }
          $assets.Add($manifest)

          # The signed version map (every release but a preview). It is not in the
          # manifest: vmap-publish.yml may replace it with a newer one, and
          # release-check.mjs reads it on its own.
          $versionMap = "$ws\version-map-client.v1.txt"
          if (Test-Path $versionMap) { $assets.Add($versionMap) }

          Write-Host "Uploading $($assets.Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }

          # A resumed draft that was rebuilt: every asset on it is replaced with the
          # files of this one build, so the set is never a mix of two builds. Only a
          # draft is touched. The check is repeated here, and the run group admits no
          # other run, so nothing can publish it between this check and the upload.
          if ($env:RELEASE_STATE -eq 'draft') {
            $repo = $env:GITHUB_REPOSITORY
            $isDraft = gh api "repos/$repo/releases/$($env:DRAFT_ID)" --jq .draft
            if ($LASTEXITCODE -ne 0) { throw "Draft $tag (id $($env:DRAFT_ID)) could not be read." }
            if ($isDraft -ne 'true') { throw "Release $tag is not a draft any more, so its assets are not touched." }
            $old = @(gh api --paginate "repos/$repo/releases/$($env:DRAFT_ID)/assets" --jq '.[].id')
            if ($LASTEXITCODE -ne 0) { throw "The assets of draft $tag could not be listed." }
            foreach ($id in $old) {
              gh api -X DELETE "repos/$repo/releases/assets/$id"
              if ($LASTEXITCODE -ne 0) { throw "Asset $id of draft $tag could not be removed." }
            }
            Write-Host "Removed $($old.Count) asset(s) from draft $tag; uploading the rebuilt set."
            gh release upload $tag @assets --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw "The rebuilt assets could not be uploaded to draft $tag." }
            exit 0
          }

          $flags = @('--title', "StarRupture ModLoader $tag", '--generate-notes')
          # Put UPDATE_NOTES.txt above the generated list when it exists.
          $notesFile = "$ws\UPDATE_NOTES.txt"
          if ((Test-Path $notesFile) -and (Get-Content $notesFile | Where-Object { $_.Trim() })) {
            $flags += @('--notes-file', $notesFile)
          }
          if ("${{ needs.prepare.outputs.is_preview }}" -eq 'true') {
            $flags += '--prerelease'
          }
          # A draft: nothing is public and the release has no tag until the publish
          # job runs. --target fixes the commit that tag will point at.
          $flags += @('--draft', '--target', "${{ needs.prepare.outputs.sha }}")
          gh release create $tag @assets @flags

  # Only for a resume. Looks at what the release holds before anything is built:
  # - A draft that is whole goes straight on to the check and the publish. A draft
  #   that is missing an asset or holds a wrong one gets rebuilt whole (complete is
  #   false), which is safe because nothing about a draft is public.
  # - A public release must hold every asset it lists, each with the right md5,
  #   before Nexus gets anything. It is never repaired in place: one that fails the
  #   check stops the run here, red, and pulling it (the release and its tag) is the
  #   owner's call. The version map is not asked for: publish-feed attaches a newer
  #   one on its own.
  inspect:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && (needs.prepare.outputs.state == 'public' || needs.prepare.outputs.state == 'draft') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to read: the releases list shows drafts to a token with push access
    outputs:
      complete: ${{ steps.draft.outputs.complete }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the public release
        if: ${{ needs.prepare.outputs.state == 'public' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          node .github/scripts/release-check.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version-map skip | tee "$RUNNER_TEMP/check.json"
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            echo "::error title=Release $TAG is public and failed the asset check (exit $code)::$(cat "$RUNNER_TEMP/check.json") A public release is not repaired in place and its assets are not touched. Pulling this release and its tag is the owner's call; Nexus was not touched."
          fi
          exit "$code"

      - name: Check the draft
        id: draft
        if: ${{ needs.prepare.outputs.state == 'draft' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          node .github/scripts/release-check.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --pre-publish | tee "$RUNNER_TEMP/check.json"
          code=${PIPESTATUS[0]}
          case "$code" in
            0) echo "complete=true" >> "$GITHUB_OUTPUT"; echo "Draft $TAG is whole." ;;
            1) echo "complete=false" >> "$GITHUB_OUTPUT"; echo "::notice title=Draft $TAG is not whole::It will be rebuilt whole from its commit: $(cat "$RUNNER_TEMP/check.json")" ;;
            *) echo "::error title=Draft $TAG could not be checked (exit $code)::$(cat "$RUNNER_TEMP/check.json") Nothing was changed."; exit "$code" ;;
          esac

  # The draft holds every asset it lists, each with the right md5 and the signed
  # version map, before it is published. Nothing is public while this runs. A
  # resumed draft that was whole skips the build and comes straight here.
  verify-release:
    needs: [prepare, inspect, release]
    if: |
      !cancelled() &&
      (needs.release.result == 'success' ||
       (needs.prepare.outputs.state == 'draft' && needs.inspect.outputs.complete == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only to read the draft: the releases list shows drafts to a token with push access
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set +e
          node .github/scripts/release-check.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --pre-publish | tee "$RUNNER_TEMP/check.json"
          code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            echo "::error title=Draft $TAG failed the asset check (exit $code)::$(cat "$RUNNER_TEMP/check.json") Nothing is public. It was not published."
          fi
          exit "$code"

  # The only job that makes the release public. Everything that reads it, or
  # builds on it, comes after this job.
  publish:
    needs: [prepare, verify-release]
    if: ${{ !cancelled() && needs.verify-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # turns the draft into the public release (and creates its tag)
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)
          [ "$draft" = "false" ] || { echo "::error title=$TAG is still a draft::The publish did not take effect."; exit 1; }
          echo "Published $TAG."

  # Nexus gets the ZIPs from the published release, not from the build run, so a
  # resume has the same files. It is a job of its own so a Nexus failure (API
  # error, key, rate limit) cannot hold back publish-feed or the jobs after it:
  # the release is already Latest by then.
  nexus:
    needs: [prepare, inspect, release, publish]
    if: |
      always() &&
      (needs.publish.result == 'success' ||
       (needs.prepare.outputs.state == 'public' && needs.inspect.result == 'success')) &&
      needs.prepare.outputs.is_preview != 'true' &&
      (github.event.inputs.resume_tag == '' || github.event.inputs.resume_nexus != 'none')
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release ZIPs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "StarRupture-ModLoader-*-$env:TAG.zip" --dir .

      # A fresh release has its changelog from the release job. A resumed one
      # reads the same file, UPDATE_NOTES.txt, as it was at the tag.
      - name: Read the changelog of the resumed release
        id: resumed
        if: ${{ github.event.inputs.resume_tag != '' }}
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --depth=1 origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)"
          if ($LASTEXITCODE -ne 0) { throw "Tag $($env:TAG) could not be fetched." }
          $lines = @(git show "refs/tags/$($env:TAG):UPDATE_NOTES.txt" 2>$null | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          # A tag without the file is not an error: the changelog falls back to a link.
          $global:LASTEXITCODE = 0
          $changelog = if ($lines.Count -gt 0) { $lines -join "`n" } else { "See https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG" }
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<$delim`n$changelog`n$delim"

      - name: Upload Client build to Nexus Mods
        if: ${{ github.event.inputs.resume_tag == '' || github.event.inputs.resume_nexus != 'server-only' }}
        uses: msantoro12/starrupture-release-actions/nexus-publish@f7b2ee28d777797e62963242ab22aa709299c652 # nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/89 -> data.id
          mod_id: '37074157699161'
          file_id: ${{ secrets.NEXUS_SR_ML_CLIENT_GROUP_ID }}
          filename: ${{ github.workspace }}\StarRupture-ModLoader-Client-${{ needs.prepare.outputs.tag }}.zip
          display_name: "StarRupture ModLoader Client ${{ needs.prepare.outputs.tag }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          version: ${{ needs.prepare.outputs.tag }}
          changelog: ${{ needs.release.outputs.changelog || steps.resumed.outputs.changelog }}
          description_file: nexus/description.bbcode
          tag: ${{ needs.prepare.outputs.tag }}

      - name: Upload Server build to Nexus Mods
        uses: msantoro12/starrupture-release-actions/nexus-publish@f7b2ee28d777797e62963242ab22aa709299c652 # nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          mod_id: '37074157699161'
          file_id: ${{ secrets.NEXUS_SR_ML_SERVER_GROUP_ID }}
          filename: ${{ github.workspace }}\StarRupture-ModLoader-Server-${{ needs.prepare.outputs.tag }}.zip
          display_name: "StarRupture ModLoader Server ${{ needs.prepare.outputs.tag }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}"
          version: ${{ needs.prepare.outputs.tag }}
          update_page: false

      # The release is public already, so a failed upload is finished by a
      # resume or by hand; this puts both ways in the run, not in a log.
      - name: Say how to publish Nexus by hand
        if: ${{ failure() }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          text=$(node .github/scripts/resume-notice.mjs nexus-text)
          printf '%s\n' "$text" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Nexus publish failed::${text//$'\n'/%0A}"

  # The release already carries the signed version object map (it was uploaded to
  # the draft). This runs vmap-publish.yml after the publish, so a newer map that
  # appeared meanwhile reaches Latest in the same run; it does nothing when Latest
  # already has the newest one. vmap-publish.yml holds the checks.
  publish-feed:
    needs: [prepare, inspect, publish]
    if: |
      always() &&
      (needs.publish.result == 'success' ||
       (needs.prepare.outputs.state == 'public' && needs.inspect.result == 'success')) &&
      needs.prepare.outputs.is_preview != 'true'
    permissions:
      contents: write  # vmap-publish.yml uploads the asset to the new release
    uses: ./.github/workflows/vmap-publish.yml

  # Last word on the release: checks it whole (assets, md5 and the version map)
  # and, when a job failed or the check finds something missing after the release
  # went public, fails the run and puts the one resume command in its summary.
  # A tag with no public release is nothing stuck: run the workflow again.
  notice:
    needs: [prepare, inspect, release, verify-release, publish, nexus, publish-feed]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release and name the command that finishes it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set +e
          node .github/scripts/release-check.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" > "$RUNNER_TEMP/check.json"
          CHECK_JSON=$(cat "$RUNNER_TEMP/check.json")
          export CHECK_JSON
          node .github/scripts/resume-notice.mjs release > "$RUNNER_TEMP/notice.md"
          code=$?
          cat "$RUNNER_TEMP/notice.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notice.md"
          exit "$code"

  # After the publish: it uses the same tag, and a release that is still a draft
  # has no tag to sync from. The DLLs come from this run's build when it made one
  # and from the published release when it did not (a resume).
  sync-plugin-sdk:
    needs: [prepare, release, publish]
    if: |
      always() &&
      (github.event.inputs.sync_plugin_sdk == 'true' || github.event.inputs.sync_only == 'true') &&
      (needs.publish.result == 'success' || (github.event.inputs.sync_only == 'true' && needs.publish.result == 'skipped')) &&
      needs.prepare.outputs.is_preview != 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Resolve tag and DLL source
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ needs.prepare.outputs.tag }}
          HAVE_ARTIFACT: ${{ needs.release.result == 'success' }}
        run: |
          if ($env:BUILD_TAG -and $env:BUILD_TAG -ne '') {
            # This run's release (made now, or resumed) — the tag came from prepare
            Write-Host "Using tag from this run: $env:BUILD_TAG"
            echo "TAG=$env:BUILD_TAG" >> $env:GITHUB_OUTPUT
            echo "FROM_ARTIFACT=$($env:HAVE_ARTIFACT)" >> $env:GITHUB_OUTPUT
          } else {
            # Sync-only — the tag of the Latest release of this repo. Not the first
            # entry of the release list: that can be a draft or a preview.
            $tag = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name
            if ($LASTEXITCODE -ne 0 -or -not $tag) { Write-Error "No Latest release found to sync."; exit 1 }
            Write-Host "Sync-only mode — using latest release tag: $tag"
            echo "TAG=$tag"           >> $env:GITHUB_OUTPUT
            echo "FROM_ARTIFACT=false" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout main repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main

      - name: Checkout plugin SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk

      - name: Download pre-built dwmapi.dll artifacts (from build job)
        if: ${{ steps.resolve.outputs.FROM_ARTIFACT == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: modloader-dlls
          path: modloader-dlls

      - name: Download pre-built dwmapi.dll artifacts (from latest release)
        if: ${{ steps.resolve.outputs.FROM_ARTIFACT == 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.TAG }}"
          New-Item -ItemType Directory -Force modloader-dlls | Out-Null
          gh release download $tag `
            --repo ${{ github.repository }} `
            --pattern "dwmapi-Client.dll" `
            --pattern "dwmapi-Server.dll" `
            --dir modloader-dlls
          Write-Host "Downloaded DLLs from release $tag"

      - name: Sync headers into plugin SDK repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "sdk\include" | Out-Null
          Copy-Item "main\StarRupture-ModLoader-Core\plugins\plugin_interface.h" "sdk\include\plugin_interface.h" -Force
          Write-Host "Sync complete."

      - name: Commit and push to SDK repo
        shell: pwsh
        run: |
          cd sdk
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          $diff = git diff --cached --name-only
          if (-not $diff) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Sync from modloader ${{ steps.resolve.outputs.TAG }}"
          git push

      - name: Create SDK release with pre-built dwmapi.dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_PAT }}
        run: |
          $tag = "${{ steps.resolve.outputs.TAG }}"

          Copy-Item "modloader-dlls\dwmapi-Client.dll" "dwmapi-Client.dll"
          Copy-Item "modloader-dlls\dwmapi-Server.dll" "dwmapi-Server.dll"

          cd sdk
          gh release create $tag `
            --repo AlienXAXS/StarRupture-Plugin-SDK `
            --title "Plugin SDK $tag" `
            --notes "Auto-synced from modloader $tag.`n`nDownload ``dwmapi-Client.dll`` or ``dwmapi-Server.dll`` to test your plugin locally (rename to ``dwmapi.dll`` before deploying)." `
            "..\dwmapi-Client.dll" `
            "..\dwmapi-Server.dll"

  # After the publish, so a plugin build never runs against an unpublished loader.
  trigger-plugin-builds:
    needs: [prepare, publish]
    if: |
      always() &&
      github.event.inputs.auto_build_plugins == 'true' &&
      needs.publish.result == 'success' &&
      needs.prepare.outputs.is_preview != 'true'
    uses: ./.github/workflows/build-plugins.yml
    with:
      plugins: all
    secrets:
      PLUGIN_BUILD_PAT: ${{ secrets.PLUGIN_BUILD_PAT }}
