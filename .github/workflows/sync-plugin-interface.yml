name: Sync plugin headers to Plugin SDK

on:
  push:
    branches:
      - main
    paths:
      - 'StarRupture-ModLoader-Core/plugins/plugin_interface.h'
      - 'StarRupture-ModLoader-Core/plugins/known_gobjects.generated.h'

concurrency:
  group: sync-plugin-sdk-next
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout Plugin SDK repo
        uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          token: ${{ secrets.SDK_REPO_PAT }}
          path: sdk

      # Pushes go to the SDK's `next` branch, not its main. The SDK main only
      # moves when the loader is released (sync-plugin-sdk in release.yml), so
      # a plugin built from SDK main always targets an interface a released
      # loader accepts.
      - name: Select the next branch
        run: |
          cd sdk
          if git ls-remote --exit-code --heads origin refs/heads/next > /dev/null; then
            git fetch origin refs/heads/next:refs/remotes/origin/next
            git checkout -B next origin/next
          else
            git checkout -b next
          fi

      - name: Copy updated headers
        run: |
          mkdir -p sdk/include
          cp StarRupture-ModLoader-Core/plugins/plugin_interface.h sdk/include/plugin_interface.h
          cp StarRupture-ModLoader-Core/plugins/known_gobjects.generated.h sdk/include/known_gobjects.generated.h

      - name: Commit and push
        run: |
          cd sdk
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add include/plugin_interface.h include/known_gobjects.generated.h
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "Update plugin headers from modloader $(cd .. && git rev-parse --short HEAD)"
          git push origin next
