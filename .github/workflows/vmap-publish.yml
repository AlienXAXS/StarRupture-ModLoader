name: Publish the version-map feed

# Pull model: this workflow holds no signing key. It downloads the signed feed
# from the feed repo's `vmap-feed` release, checks it with the public keys in
# version_feed.cpp, and puts it on this repository's Latest release.
#
# A feed that fails the check fails the run and is not uploaded. A feed whose
# seq does not rise above the newest one on a release is valid and is not
# uploaded, unless Latest carries no feed (see below). A feed already on a
# release that fails the check is skipped with a warning when the seq to beat is
# found, so one bad file there cannot stop every later run.
#
# release.yml calls this workflow as its last job, so a new release gets the
# feed in the same run (a release made with GITHUB_TOKEN starts no
# `release: published` workflow, which is why it is a call and not a trigger).
# The scheduled run stays as the backstop and as the way a feed that rises
# between releases reaches Latest. Latest with no feed of its own takes the
# current feed even when its seq equals the one on an older release; it is
# never given an older one.
#
# The seq to beat is that of the newest release that carries a feed, read only
# after that file verifies. With no feed on any release, only a manual run with
# first_publish set uploads one, so an older signed feed cannot be the first.
#
# Slot k1 holds a TEST key and slot k2 the release key. A TEST-key feed is always
# refused: the release this copies to is Latest, which release loaders read and
# which is never a prerelease.

on:
  workflow_call:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      feed_repo:
        description: 'Repository that holds the signed feed'
        type: string
        default: 'msantoro12/starrupture-ci'
      feed_release:
        description: 'Release tag in that repository'
        type: string
        default: 'vmap-feed'
      first_publish:
        description: 'No release carries a feed yet; publish the first one'
        type: boolean
        default: false

concurrency:
  group: vmap-publish
  cancel-in-progress: false

permissions:
  contents: write  # uploads the asset to the Latest release

# A failed or cancelled run is red and its last job (notice) puts the one command
# that runs it again in the job summary; the run's failure e-mail is the alert.
env:
  FEED_REPO: ${{ inputs.feed_repo || 'msantoro12/starrupture-ci' }}
  FEED_RELEASE: ${{ inputs.feed_release || 'vmap-feed' }}
  FIRST_PUBLISH: ${{ inputs.first_publish && 'true' || 'false' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      FEED_ASSET: version-map-client.v1.txt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A rehearsal file is signed with the release key at a seq above the live one,
      # so on Latest it would replace the real version map for every player.
      - name: Refuse a rehearsal as the source
        run: |
          set -uo pipefail
          if [ "${FEED_RELEASE,,}" = "vmap-feed-rehearsal" ]; then
            echo "::error title=Rehearsal source refused::feed_release $FEED_RELEASE is the rehearsal prerelease. Its files are for tests and must not be copied to the Latest release of $GITHUB_REPOSITORY."
            exit 1
          fi

      # Without the signed file there is nothing to copy: stop here, loudly.
      - name: Check the signed version map is there
        run: |
          set -uo pipefail
          if ! names=$(gh release view "$FEED_RELEASE" --repo "$FEED_REPO" --json assets --jq '.assets[].name'); then
            echo "::error title=Signed version map not readable::Release $FEED_RELEASE in $FEED_REPO could not be read, so nothing was copied to the Latest release of $GITHUB_REPOSITORY."
            exit 1
          fi
          if ! grep -qxF "$FEED_ASSET" <<< "$names"; then
            echo "::error title=No signed version map to copy::Release $FEED_RELEASE in $FEED_REPO has no $FEED_ASSET, so nothing was copied to the Latest release of $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Find the Latest release and its seq
        id: latest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cur" "$RUNNER_TEMP/new"
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "No Latest release; nothing to attach the feed to."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=
          # A draft (a release being made by release.yml) is not public: its feed
          # is not a feed players can get, so it must not set the seq to beat.
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName'); do
            gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern "$FEED_ASSET" --dir "$RUNNER_TEMP/cur" --clobber 2>/dev/null || continue
            args=(--source StarRupture-ModLoader-Core/memory_scanner/version_feed.cpp --refuse-test-key)
            # A feed on a release that does not verify must not stop every run:
            # it is left out and the newest one that verifies sets the seq to beat.
            # Only a refusal (exit 3) is skipped; a failure of the check itself is not.
            code=0
            seq=$(node .github/vmap/verify-feed.mjs "$RUNNER_TEMP/cur/$FEED_ASSET" "${args[@]}") || code=$?
            if [ "$code" = 3 ]; then
              echo "::warning title=Version map on release $t skipped::It does not verify (reason above), so it is not used to find the seq to beat. The newest one that verifies is used instead."
              continue
            fi
            [ "$code" = 0 ] || exit "$code"
            last=$seq
            echo "The newest feed is on release $t, seq $last."
            # Latest has none yet (a release since the last upload): the same
            # seq goes on it too, so Latest always carries the current feed.
            [ "$t" = "$tag" ] || last=$((last - 1))
            break
          done
          if [ -z "$last" ]; then
            [ "$FIRST_PUBLISH" = "true" ] || { echo "::error::No release carries a feed that verifies. Run this workflow with first_publish set to publish the first one."; exit 1; }
            last=0
          fi
          echo "Latest is $tag, the seq to beat is $last."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

      - name: Download the signed feed
        if: steps.latest.outputs.tag != ''
        run: gh release download "$FEED_RELEASE" --repo "$FEED_REPO" --pattern "$FEED_ASSET" --dir "$RUNNER_TEMP/new" --clobber

      - name: Verify it
        id: verify
        if: steps.latest.outputs.tag != ''
        run: |
          set +e
          args=(--source StarRupture-ModLoader-Core/memory_scanner/version_feed.cpp --last-seq "${{ steps.latest.outputs.last }}" --refuse-test-key)
          node .github/vmap/verify-feed.mjs "$RUNNER_TEMP/new/$FEED_ASSET" "${args[@]}"
          code=$?
          if [ "$code" = 4 ]; then
            echo "The feed on $FEED_REPO is not newer than the one on Latest. Nothing to upload."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$code" = 0 ] || exit "$code"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Upload it to Latest
        if: steps.verify.outputs.upload == 'true'
        run: gh release upload "${{ steps.latest.outputs.tag }}" "$RUNNER_TEMP/new/$FEED_ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  # A failed or cancelled copy: say which command runs it again. The job fails so
  # the run is red either way; it reads and writes nothing else.
  notice:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the command that runs it again
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set +e
          node .github/scripts/resume-notice.mjs vmap > "$RUNNER_TEMP/notice.md"
          code=$?
          cat "$RUNNER_TEMP/notice.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/notice.md"
          exit "$code"
